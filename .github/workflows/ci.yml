name: CI

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: ruff check .
      - run: pytest
      - run: python -m build
      - run: molprop-fusion --help
      - run: molprop-fusion check-config configs/public_benchmarks.yaml configs/aqsoldb_transfer.yaml
      - run: molprop-fusion verify-results

  toolkit:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[full,test]"
      - run: pytest
      - run: python examples/tutorial.py --mode tabular --output outputs/tutorial-tabular
      - run: python examples/tutorial.py --mode full --output outputs/tutorial-full
